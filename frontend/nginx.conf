server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Chamadas /api/... vão para o backend (o /api é removido no caminho)
    location /api/ {
        proxy_pass http://cv-backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Qualquer outra rota cai no React (necessário para o react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}